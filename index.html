<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --grey:#8c8c8c;
    --grey-light:#e6e6e6;
    --grey-hover:#f2f2f2;
    --mono:'Space Mono', monospace;
    --sans:'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  #page{width:min(1040px, 94vw);margin:0 auto;padding:28px 0 120px;}

  /* ---------- header ---------- */
  #top{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:14px;}
  #logo-link{display:block;}
  #logo{display:block;height:58px;width:auto;}
  #submit-btn{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
    border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
    padding:9px 14px;cursor:pointer;transition:background .2s ease,color .2s ease;
  }
  #submit-btn:hover{background:var(--ink);color:var(--paper);}
  .rule-thin{border:0;border-top:1px solid var(--ink);margin:0;}
  .rule-thick{border:0;border-top:3px solid var(--ink);margin:0;}
  #nav{display:flex;gap:16px;padding:9px 0;font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;}
  #nav a{color:var(--grey);}
  #nav a:hover{color:var(--ink);}

  /* ---------- grid ---------- */
  .date-label{
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.14em;
    margin:16px 0 18px;text-transform:uppercase;
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .cell{
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:0;transform:translateY(18px);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .cell img{display:block;max-width:100%;max-height:100%;object-fit:contain;transition:opacity .2s ease;}
  .cell:hover img{opacity:.78;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  #status{font-family:var(--mono);font-size:12px;color:var(--grey);text-align:center;padding:48px 0;}
  #more-btn{
    display:block;margin:36px auto 0;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    border:1px solid var(--ink);background:var(--paper);padding:10px 22px;cursor:pointer;
  }
  #more-btn:hover{background:var(--grey-hover);}

  /* ---------- detail ---------- */
  #detail{display:none;}
  #detail-frame{
    width:min(720px,100%);margin:6px auto 0;border:1px solid var(--ink);padding:0;background:var(--paper);
  }
  #detail-img{display:block;width:100%;height:auto;}
  #detail-meta{width:min(720px,100%);margin:18px auto 0;}
  #detail-caption{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:0 0 14px;}
  #detail-time{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--grey);}
  #detail-time b{color:var(--ink);}
  #back{display:inline-block;margin-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--ink);}

  /* ---------- modal ---------- */
  #modal{position:fixed;inset:0;background:rgba(255,255,255,.96);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
  #modal.open{display:flex;}
  #modal-box{width:min(420px,100%);border:1.5px solid var(--ink);background:var(--paper);padding:24px;}
  #modal-title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin:0 0 16px;}
  #modal-close{position:absolute;top:22px;right:26px;width:38px;height:38px;border:1.5px solid var(--ink);background:var(--paper);font-family:var(--mono);font-size:16px;cursor:pointer;}
  #modal-close:hover{background:var(--grey-hover);}
  input[type="password"], textarea{
    width:100%;font-family:var(--sans);font-size:14px;border:1px solid var(--ink);background:var(--paper);
    color:var(--ink);padding:10px 12px;outline:none;resize:none;
  }
  input[type="password"]{font-family:var(--mono);}
  input[type="password"]:focus, textarea:focus{background:var(--grey-hover);}
  textarea{min-height:84px;line-height:1.5;margin-top:10px;}
  .file-btn{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;border:1px solid var(--ink);background:var(--paper);
    padding:9px 12px;cursor:pointer;display:inline-block;user-select:none;
  }
  .file-btn:hover{background:var(--grey-hover);}
  #file-input{display:none;}
  #preview{margin-top:12px;display:none;}
  #preview img{display:block;max-width:100%;max-height:220px;border:1px solid var(--ink);}
  .primary{
    margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;border:1.5px solid var(--ink);
    background:var(--ink);color:var(--paper);padding:10px 18px;cursor:pointer;transition:opacity .2s ease;
  }
  .primary:hover{opacity:.78;}
  .primary:disabled{opacity:.4;cursor:default;}
  #hint{font-family:var(--mono);font-size:10px;color:var(--grey);margin-top:10px;min-height:14px;}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;}

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);gap:14px;}
    #logo{height:46px;}
  }
</style>
</head>
<body>
<div id="page">

<script type="module">
  "use strict";

  // ============================================================
  // Firebase 설정 
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyA2lYY129chFwUNFoxZ94LJG0x_gnj38r8",
    authDomain: "theblgrs-lounge.firebaseapp.com",
    projectId: "theblgrs-lounge",
    storageBucket: "theblgrs-lounge.firebasestorage.app",
    messagingSenderId: "236316360066",
    appId: "1:236316360066:web:5371e6572520b09ca7639b"
  };

  // 관리자 계정 (비밀번호는 Firebase가 서버에서 확인합니다)
  const ADMIN_EMAIL = "admin@theblgrs.com";

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc,
    query, orderBy, limit, startAfter
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const photosRef = collection(db, "photos");      // 썸네일 + 글 (목록용, 가벼움)
  const fullsRef  = collection(db, "photoFull");   // 원본 확대 이미지 (클릭했을 때만 로드)

  const PAGE = 30;
  let lastDoc = null;
  let hasMore = true;
  let loading = false;
  let lastDateKey = null;
  let currentGrid = null;
  let currentId = null;
  const cache = {}; // id -> {thumb, caption, time}

  const $ = (id) => document.getElementById(id);

  // ---------- 날짜 포맷 ----------
  function dateLabel(ms){
    return new Date(ms).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}).toUpperCase();
  }
  function timeLabel(ms){
    var d = new Date(ms);
    var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ap;
  }

  // ---------- 목록 로드 ----------
  async function loadMore(){
    if (loading || !hasMore) return;
    loading = true;
    try {
      var q = lastDoc
        ? query(photosRef, orderBy('time','desc'), startAfter(lastDoc), limit(PAGE))
        : query(photosRef, orderBy('time','desc'), limit(PAGE));
      var snap = await getDocs(q);
      var batch = [];
      snap.forEach(function(d){
        var data = d.data();
        cache[d.id] = data;
        batch.push({id:d.id, data:data});
      });
      if (snap.docs.length) lastDoc = snap.docs[snap.docs.length - 1];
      hasMore = snap.docs.length === PAGE;
      renderBatch(batch);
      $('status').style.display = (Object.keys(cache).length === 0) ? 'block' : 'none';
      if (Object.keys(cache).length === 0) $('status').textContent = '아직 사진이 없습니다.';
      $('more-btn').style.display = hasMore ? 'block' : 'none';
    } catch (err) {
      console.error(err);
      $('status').style.display = 'block';
      $('status').textContent = '사진을 불러오지 못했어요. Firebase 설정/규칙을 확인해주세요.';
    } finally {
      loading = false;
    }
  }

  function renderBatch(batch){
    var feed = $('feed');
    batch.forEach(function(item, i){
      var key = dateLabel(item.data.time);
      if (key !== lastDateKey){
        var label = document.createElement('div');
        label.className = 'date-label';
        label.textContent = key;
        feed.appendChild(label);
        currentGrid = document.createElement('div');
        currentGrid.className = 'grid';
        feed.appendChild(currentGrid);
        lastDateKey = key;
      }
      var cell = document.createElement('a');
      cell.className = 'cell';
      cell.href = '#/p/' + item.id;
      cell.style.animationDelay = Math.min(i * 70, 1400) + 'ms';
      var img = document.createElement('img');
      img.src = item.data.thumb;
      img.alt = item.data.caption || '';
      cell.appendChild(img);
      currentGrid.appendChild(cell);
    });
  }

  $('more-btn').addEventListener('click', loadMore);

  // ---------- 라우팅 (목록 <-> 상세) ----------
  async function route(){
    var m = location.hash.match(/^#\/p\/(.+)$/);
    if (!m){
      $('detail').style.display = 'none';
      $('home').style.display = 'block';
      return;
    }
    var id = m[1];
    currentId = id;
    $('home').style.display = 'none';
    $('detail').style.display = 'block';
    window.scrollTo(0, 0);

    $('detail-img').removeAttribute('src');
    $('detail-caption').textContent = '';
    $('detail-time').textContent = '';
    $('detail-date').textContent = '';

    try {
      var meta = cache[id];
      if (!meta){
        var ms = await getDoc(doc(db, 'photos', id));
        if (!ms.exists()){ $('detail-caption').textContent = '존재하지 않는 사진입니다.'; return; }
        meta = ms.data();
        cache[id] = meta;
      }
      $('detail-date').textContent = dateLabel(meta.time);
      $('detail-caption').textContent = meta.caption || '';
      $('detail-time').innerHTML = '<b>' + timeLabel(meta.time) + '</b>';
      $('detail-img').src = meta.thumb; // 먼저 썸네일 → 원본으로 교체

      var fs = await getDoc(doc(db, 'photoFull', id));
      if (fs.exists() && location.hash === '#/p/' + id){
        $('detail-img').src = fs.data().full;
      }
    } catch (err) {
      console.error(err);
    }
  }
  window.addEventListener('hashchange', route);

  // ---------- 모달 / 로그인 ----------
  var modal = $('modal');
  var unlocked = false;

  function showHint(msg){
    var h = $('hint');
    h.textContent = msg;
    setTimeout(function(){ if (h.textContent === msg) h.textContent = ''; }, 3000);
  }
  function refreshModal(){
    $('pw-form').style.display = unlocked ? 'none' : 'block';
    $('up-form').style.display = unlocked ? 'block' : 'none';
    $('delete-btn').style.display = unlocked ? 'inline-block' : 'none';
  }
  function openModal(){
    modal.classList.add('open');
    refreshModal();
    if (!unlocked) setTimeout(function(){ $('pw').focus(); }, 50);
  }
  function closeModal(){ modal.classList.remove('open'); }

  $('submit-btn').addEventListener('click', openModal);
  $('modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

  onAuthStateChanged(auth, function(user){
    unlocked = !!(user && user.email === ADMIN_EMAIL);
    refreshModal();
  });

  $('pw-form').addEventListener('submit', async function(e){
    e.preventDefault();
    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $('pw').value);
      $('pw').value = '';
    } catch (err) {
      console.error(err);
      var c = err && err.code || '';
      if (c === 'auth/network-request-failed') showHint('네트워크 오류예요. 광고 차단을 확인해주세요.');
      else if (c === 'auth/too-many-requests') showHint('시도가 너무 많아요. 잠시 후 다시 해주세요.');
      else showHint('비밀번호가 틀렸어요.');
      $('pw').value = '';
    }
  });

  $('logout-btn').addEventListener('click', async function(){
    await signOut(auth);
    closeModal();
  });

  // ---------- 삭제 ----------
  $('delete-btn').addEventListener('click', async function(){
    if (!unlocked || !currentId) return;
    if (!confirm('이 사진을 삭제할까요? 되돌릴 수 없습니다.')) return;
    try {
      await deleteDoc(doc(db, 'photoFull', currentId));
      await deleteDoc(doc(db, 'photos', currentId));
      $('feed').innerHTML = '';
      lastDoc = null; hasMore = true; lastDateKey = null; currentGrid = null;
      Object.keys(cache).forEach(function(k){ delete cache[k]; });
      location.hash = '#/';
      await loadMore();
    } catch (err) {
      console.error(err);
      alert('삭제에 실패했어요. 다시 로그인해 보세요.');
    }
  });

  // ---------- 이미지 압축 ----------
  var pendingFile = null;
  $('file-input').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if (!f) return;
    if (!f.type.startsWith('image/')){ showHint('이미지 파일만 가능해요.'); this.value = ''; return; }
    pendingFile = f;
    var url = URL.createObjectURL(f);
    $('preview').style.display = 'block';
    $('preview').querySelector('img').src = url;
  });

  function loadImage(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = url;
    });
  }
  function encode(img, maxSide, quality){
    var w = img.naturalWidth, h = img.naturalHeight;
    var scale = Math.min(1, maxSide / Math.max(w, h));
    w = Math.round(w * scale); h = Math.round(h * scale);
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return { url: c.toDataURL('image/jpeg', quality), w: w, h: h };
  }
  // Firestore 문서 1개 = 최대 1MB → 넘지 않을 때까지 크기/화질을 단계적으로 낮춤
  function encodeFull(img){
    var sides = [1600, 1280, 1000, 800, 640];
    var quals = [0.85, 0.75, 0.65];
    for (var s = 0; s < sides.length; s++){
      for (var q = 0; q < quals.length; q++){
        var r = encode(img, sides[s], quals[q]);
        if (r.url.length < 900000) return r;
      }
    }
    return null;
  }

  $('up-form').addEventListener('submit', async function(e){
    e.preventDefault();
    if (!unlocked) return;
    if (!pendingFile){ showHint('사진을 선택해주세요.'); return; }
    var btn = $('up-btn');
    btn.disabled = true; btn.textContent = '...';
    try {
      var img = await loadImage(pendingFile);
      var full = encodeFull(img);
      if (!full) throw new Error('too large');
      var thumb = encode(img, 520, 0.72);
      var caption = $('caption').value.trim();

      var ref = doc(photosRef);
      await setDoc(doc(db, 'photoFull', ref.id), { full: full.url });          // 원본 먼저
      var meta = { thumb: thumb.url, caption: caption, time: Date.now(), w: full.w, h: full.h };
      await setDoc(ref, meta);                                                  // 그 다음 목록용

      // 화면 즉시 반영 (처음부터 다시 로드)
      $('feed').innerHTML = '';
      lastDoc = null; hasMore = true; lastDateKey = null; currentGrid = null;
      Object.keys(cache).forEach(function(k){ delete cache[k]; });
      await loadMore();

      pendingFile = null;
      $('file-input').value = '';
      $('preview').style.display = 'none';
      $('caption').value = '';
      closeModal();
      location.hash = '#/';
    } catch (err) {
      console.error(err);
      showHint('업로드에 실패했어요. (Firebase 규칙/용량 확인)');
    } finally {
      btn.disabled = false; btn.textContent = 'POST';
    }
  });

  // ---------- init ----------
  loadMore().then(route);
</script>
</body>
</html>
